packages:
  - apps/*

allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  esbuild: true
  prisma: true
  sharp: true
  unrs-resolver: true
  workerd: true

overrides:
  '@fastify/static': ^10.1.2
  deepmerge-ts: ^8.0.0
  postcss: ^8.5.23
  source-map-js: ^1.2.2
  'fast-uri@^3': ^3.1.9
  'fast-uri@^4': ^4.2.3
  glob: ^14.0.2
  minimatch: ^11.0.1
  brace-expansion: ^5.0.12
  sharp: ^0.35.5

onlyBuiltDependencies:
  - esbuild
  - sharp
  - unrs-resolver
  - workerd
