packages:
  - apps/*

allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  esbuild: true
  prisma: true
  sharp: true
  unrs-resolver: true
  workerd: true

overrides:
  '@fastify/static': ^10.1.2
  deepmerge-ts: ^8.0.0
  postcss: ^8.5.23
  sharp: ^0.35.0

onlyBuiltDependencies:
  - esbuild
  - sharp
  - unrs-resolver
  - workerd
